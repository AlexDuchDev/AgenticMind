name: release-images

# Publish multi-arch (linux/amd64 + linux/arm64) AgenticMind server + worker
# images to GHCR so self-hosters can `docker pull` instead of clone-and-build —
# and run them unchanged on Apple Silicon dev machines and arm64 cloud
# (Graviton/Ampere) without a --platform flag:
#   ghcr.io/moai-team-llc/agenticmind-server:<version>   (and :latest)
#   ghcr.io/moai-team-llc/agenticmind-worker:<version>
# Fires on each version tag push; also runnable on demand.
#
# Deliberately NOT `release: [published]`. release.yml cuts the GitHub Release
# with GITHUB_TOKEN, and GitHub does not raise workflow-triggering events for
# anything GITHUB_TOKEN does — so that release never reached this file. v0.12.0
# and v0.13.0 shipped with no images at all, and `latest` sat on 0.11.0 for
# eight weeks. Earlier tags only built because a human happened to re-publish
# the release by hand minutes later. The tag push is the honest trigger: it is
# the same event release.yml already keys on, and it needs no token at all.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing + build provenance via Sigstore/OIDC

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: agenticmind-server
            dockerfile: Dockerfile.server
          - image: agenticmind-worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true # attach an SBOM attestation to the image
          provenance: mode=max # attach SLSA build provenance
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed image (keyless via Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
